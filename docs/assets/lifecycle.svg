<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Oriel verified lifecycle</title>
  <desc id="desc">A vulnerable agent fails, a hardened build qualifies and accesses data, version drift is denied, and revocation removes access.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526079"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#070b14"/>
  <text x="84" y="88" fill="#f5f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="600">Qualification is enforced, not reported</text>
  <text x="84" y="130" fill="#98a2b8" font-family="Inter,Segoe UI,sans-serif" font-size="21">Verified local run • HTTP target • deterministic verdict • protected-data gate</text>
  <rect x="1334" y="62" width="182" height="46" rx="23" fill="#14231a"/>
  <circle cx="1364" cy="85" r="7" fill="#7ee787"/>
  <text x="1382" y="92" fill="#b8f3c0" font-family="Inter,Segoe UI,sans-serif" font-size="16">TESTS GREEN</text>

  <path d="M280 390 L360 390 M605 390 L685 390 M930 390 L1010 390 M1255 390 L1335 390" fill="none" stroke="#526079" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#soft-shadow)">
    <rect x="84" y="226" width="276" height="328" rx="22" fill="#13151f" stroke="#f47067"/>
    <text x="112" y="268" fill="#f47067" font-size="15" letter-spacing="1.6">STEP 01 / ATTACK</text>
    <text x="112" y="311" fill="#f5f7fb" font-size="25" font-weight="600">Vulnerable v1</text>
    <text x="112" y="348" fill="#98a2b8" font-size="17">Private adversarial probe</text>
    <rect x="112" y="380" width="134" height="34" rx="17" fill="#321c23"/>
    <text x="179" y="403" text-anchor="middle" fill="#ff9b93" font-size="15">FAILED</text>
    <text x="112" y="455" fill="#f5f7fb" font-size="16">CANARY_LEAK</text>
    <text x="112" y="485" fill="#f5f7fb" font-size="16">UNAUTHORIZED_FUNCTION</text>
    <text x="112" y="515" fill="#f5f7fb" font-size="16">UNAUTHORIZED_HOST</text>

    <rect x="409" y="226" width="276" height="328" rx="22" fill="#111a22" stroke="#7ee787"/>
    <text x="437" y="268" fill="#7ee787" font-size="15" letter-spacing="1.6">STEP 02 / RETEST</text>
    <text x="437" y="311" fill="#f5f7fb" font-size="25" font-weight="600">Hardened v2</text>
    <text x="437" y="348" fill="#98a2b8" font-size="17">Boundary preserved</text>
    <rect x="437" y="380" width="156" height="34" rx="17" fill="#142e20"/>
    <text x="515" y="403" text-anchor="middle" fill="#a5f0b0" font-size="15">QUALIFIED</text>
    <text x="437" y="458" fill="#f5f7fb" font-size="16">Exact DID + version</text>
    <text x="437" y="488" fill="#f5f7fb" font-size="16">support.lookup only</text>
    <text x="437" y="518" fill="#98a2b8" font-size="16">TTL 300 seconds</text>

    <rect x="734" y="226" width="276" height="328" rx="22" fill="#111922" stroke="#5ce1e6"/>
    <text x="762" y="268" fill="#5ce1e6" font-size="15" letter-spacing="1.6">STEP 03 / ACCESS</text>
    <text x="762" y="311" fill="#f5f7fb" font-size="25" font-weight="600">Protected call</text>
    <text x="762" y="348" fill="#98a2b8" font-size="17">Qualification checked first</text>
    <rect x="762" y="380" width="132" height="34" rx="17" fill="#102b31"/>
    <text x="828" y="403" text-anchor="middle" fill="#92edf0" font-size="15">ALLOWED</text>
    <text x="762" y="458" fill="#f5f7fb" font-size="16">order-1042</text>
    <text x="762" y="488" fill="#f5f7fb" font-size="16">state: in_transit</text>
    <text x="762" y="518" fill="#98a2b8" font-size="16">synthetic private record</text>

    <rect x="1059" y="226" width="276" height="328" rx="22" fill="#171620" stroke="#ffbd66"/>
    <text x="1087" y="268" fill="#ffbd66" font-size="15" letter-spacing="1.6">STEP 04 / DRIFT</text>
    <text x="1087" y="311" fill="#f5f7fb" font-size="25" font-weight="600">Unqualified v3</text>
    <text x="1087" y="348" fill="#98a2b8" font-size="17">Old pass is not portable</text>
    <rect x="1087" y="380" width="128" height="34" rx="17" fill="#31271a"/>
    <text x="1151" y="403" text-anchor="middle" fill="#ffd499" font-size="15">DENIED</text>
    <text x="1087" y="458" fill="#f5f7fb" font-size="16">qualification_not_found</text>
    <text x="1087" y="500" fill="#98a2b8" font-size="16">order: null</text>

    <rect x="1384" y="226" width="132" height="328" rx="22" fill="#17131b" stroke="#c084fc"/>
    <text x="1404" y="268" fill="#d8b4fe" font-size="14" letter-spacing="1.2">STEP 05</text>
    <text x="1404" y="311" fill="#f5f7fb" font-size="21" font-weight="600">Revoke</text>
    <text x="1404" y="348" fill="#98a2b8" font-size="15">Owner only</text>
    <rect x="1404" y="380" width="92" height="34" rx="17" fill="#291d31"/>
    <text x="1450" y="403" text-anchor="middle" fill="#e9d5ff" font-size="14">DENIED</text>
    <text x="1404" y="458" fill="#f5f7fb" font-size="14">revoked</text>
    <text x="1404" y="500" fill="#98a2b8" font-size="14">order: null</text>
  </g>

  <rect x="84" y="622" width="1432" height="146" rx="22" fill="#0d1422" stroke="#29344a"/>
  <text x="118" y="663" fill="#98a2b8" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="1.5">FAIL-CLOSED INVARIANT</text>
  <text x="118" y="710" fill="#f5f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="600">No matching live qualification → no protected payload.</text>
  <text x="118" y="744" fill="#98a2b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">caller DID • build hash • tested function • allowed host • expiry • revocation</text>

  <text x="84" y="836" fill="#68758e" font-family="Inter,Segoe UI,sans-serif" font-size="16">Evidence: npm test (6) • cargo test (9 + 1 doc) • strict typecheck • release WASM build</text>
</svg>
